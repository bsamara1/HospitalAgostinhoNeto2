<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Hospital Agostinho Neto</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form id="loginForm">

<input
type="text"
id="utilizador"
placeholder="Nome do utilizador"
required>

<input
type="password"
id="senha"
placeholder="Senha"
required>

<button type="submit">
Entrar
</button>

</form>

<p id="mensagem"></p>

</div>

<script src="js/login.js"></script>

</body>

</html>
